name: Daily NYC events fetch

on:
  schedule:
    # 12:00 UTC = 7am / 8am America/New_York depending on DST -- adjust if
    # you want a specific local time year-round.
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

# GitHub Actions emails the repo owner on workflow failure by default --
# no Slack/Sentry/webhook setup needed for a single-user project.

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit updated outputs
        run: |
          git config user.name "nyc-curator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json curated.ics state.json
          git diff --quiet --cached || git commit -m "Update curated events [automated]"
          git push
